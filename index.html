<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17161c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Learn to use a computer, one short lesson at a time." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Basics" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Computer Basics</title>
    <script>
      // Theme and text size, before the first paint. The app sets both in an
      // effect (see the display-preferences effect in src/state/store.jsx),
      // which necessarily runs after the first frame — normally that costs one
      // frame of the wrong colour, but the launch animation holds the screen
      // for over two seconds, so a dark-mode user would watch a bright desk
      // and then have it snap dark under them.
      //
      // Keep this in step with that effect. It is deliberately the only
      // render-blocking script in the page: tiny, synchronous, and wrapped so
      // that storage being unavailable simply falls through to the old
      // behaviour rather than stopping the app from booting.
      try {
        var saved = JSON.parse(localStorage.getItem('computer-basics:v1') || '{}')
        var s = saved.settings || {}
        if (s.theme && s.theme !== 'system') {
          document.documentElement.dataset.theme = s.theme
          document.documentElement.style.colorScheme = s.theme
        } else {
          document.documentElement.style.colorScheme = 'light dark'
        }
        if (s.textSize) document.documentElement.dataset.textsize = s.textSize
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
